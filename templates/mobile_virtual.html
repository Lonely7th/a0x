<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f8">
  <title>虚拟盘 · A0x</title>
  <link rel="icon" type="image/png" href="/static/a0x-icon.png">
  <link rel="stylesheet" href="/static/mobile_virtual.css?v=virtual-funding-mode-1">
  <script src="/static/mobile_virtual.js?v=virtual-funding-mode-1" defer></script>
</head>
<body>
  <div class="mobile-shell">
    <header class="mobile-header">
      <div class="brand">
        <img src="/static/a0x-icon.png" alt="" width="30" height="30">
        <div><strong>A0x</strong><small>虚拟盘</small></div>
      </div>
      <button id="refresh" class="refresh" type="button" aria-label="刷新虚拟盘数据">刷新</button>
    </header>

    <main>
      <nav class="account-switch" aria-label="虚拟盘策略">
        <button type="button" data-account="stable" class="active" aria-pressed="true">稳健</button>
        <button type="button" data-account="aggressive" aria-pressed="false">激进</button>
      </nav>

      <nav class="tabs" aria-label="虚拟盘内容">
        <button type="button" data-tab="overview" class="active" aria-current="page">概览</button>
        <button type="button" data-tab="actions">操作记录</button>
        <button type="button" data-tab="positions">历史持仓</button>
        <button type="button" data-tab="settings">设置</button>
      </nav>

      <p id="sync-status" class="sync-status" role="status" aria-live="polite">正在获取数据…</p>

      <section id="panel-overview" class="tab-panel" aria-label="虚拟盘概览">
        <div class="metric-grid">
          <article class="metric capital"><span>初始本金</span><strong id="capital">—</strong></article>
          <article class="metric"><span>可部署预算</span><strong id="available">—</strong></article>
          <article class="metric"><span>账面现金</span><strong id="cash">—</strong></article>
          <article class="metric"><span>账面盈亏 <small id="asset-return" class="asset-return">—</small></span><strong id="assets">—</strong></article>
        </div>
        <p id="valuation-note" class="valuation-note" hidden></p>

        <section class="content-section" aria-labelledby="watch-title">
          <div class="section-heading"><h2 id="watch-title">当前候选股</h2><span id="watch-date"></span></div>
          <div id="watch-list" class="card-list"><p class="empty">正在获取数据…</p></div>
        </section>

        <section class="content-section" aria-labelledby="open-title">
          <h2 id="open-title">当前持仓</h2>
          <p class="section-note">当前盈亏含已减仓收入和余仓估值，未扣未来卖出费用。</p>
          <div id="open-list" class="card-list"><p class="empty">正在获取数据…</p></div>
        </section>
      </section>

      <section id="panel-actions" class="tab-panel" aria-label="虚拟盘操作记录" hidden>
        <div id="action-list" class="card-list"><p class="empty">正在获取数据…</p></div>
        <div class="pager">
          <button type="button" data-page="actions-prev">上一页</button>
          <span id="actions-page" aria-live="polite">—</span>
          <button type="button" data-page="actions-next">下一页</button>
        </div>
      </section>

      <section id="panel-positions" class="tab-panel" aria-label="虚拟盘历史持仓" hidden>
        <div id="closed-list" class="card-list"><p class="empty">正在获取数据…</p></div>
        <div class="pager">
          <button type="button" data-page="positions-prev">上一页</button>
          <span id="positions-page" aria-live="polite">—</span>
          <button type="button" data-page="positions-next">下一页</button>
        </div>
      </section>

      <section id="panel-settings" class="tab-panel" aria-label="虚拟盘设置" hidden>
        <div class="settings-card">
          <h2>资金模式</h2>
          <div class="funding-switch">
            <button type="button" data-funding-mode="cash_100w" aria-pressed="false">100万</button>
            <button type="button" data-funding-mode="leveraged_5x" aria-pressed="false">20万 5倍杠杆</button>
          </div>
          <p>两种模式共用 100 万元交易资金和同一组交易记录；切换只影响初始本金及账面盈亏率。</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
