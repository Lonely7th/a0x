<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A0x · OPENAI-A</title>
  <link rel="icon" type="image/png" href="/static/a0x-icon.png">
  <link rel="stylesheet" href="/static/app.css?v=virtual-latest-pnl-1">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-icon" src="/static/a0x-icon.png" alt=""><div><strong>A0x</strong><small>OPENAI-A</small></div></div>
    <div class="header-status"><span id="worker-badge" class="badge neutral">后台检测中</span><span id="mode-badge" class="badge neutral">模式检测中</span><button class="secondary refresh" type="button">刷新数据 ↗</button><span id="clock"></span></div>
  </header>
  <main class="layout">
    <aside class="sidebar">
      <button class="nav active" data-view="real">实盘<span id="real-pending-count" class="nav-count hidden" aria-label="未处理提醒"></span></button>
      <button class="nav" data-view="virtual">虚拟盘</button>
      <button class="nav" data-view="system">行情与系统</button>
    </aside>
    <div class="content">
      <section id="view-virtual" class="view">
        <div class="real-tabs" role="tablist" aria-label="虚拟盘内容">
          <button id="virtual-tab-overview" class="real-tab active" type="button" role="tab" aria-selected="true" aria-controls="virtual-panel-overview" data-virtual-tab="overview">概览</button>
          <button id="virtual-tab-actions" class="real-tab" type="button" role="tab" aria-selected="false" aria-controls="virtual-panel-actions" data-virtual-tab="actions">操作记录</button>
          <button id="virtual-tab-positions" class="real-tab" type="button" role="tab" aria-selected="false" aria-controls="virtual-panel-positions" data-virtual-tab="positions">历史持仓</button>
        </div>
        <section id="virtual-panel-overview" class="real-tab-panel active" role="tabpanel" aria-labelledby="virtual-tab-overview" tabindex="0">
        <div class="metrics">
          <article class="metric"><span>初始本金</span><strong id="v-capital">—</strong></article>
          <article class="metric"><span>可部署预算</span><strong id="v-available">—</strong></article>
          <article class="metric"><span>账面现金</span><strong id="v-cash">—</strong></article>
          <article class="metric"><span>当前本金</span><strong id="v-assets">—</strong><small id="v-assets-note" class="tiny hidden"></small></article>
        </div>
        <article class="panel"><div class="panel-head"><h2>当前候选股</h2><span id="v-date" class="tiny">—</span></div><div id="v-watch"></div></article>
        <article class="panel"><h2>当前持仓</h2><div id="v-positions"></div></article>
        </section>
        <section id="virtual-panel-actions" class="real-tab-panel" role="tabpanel" aria-labelledby="virtual-tab-actions" tabindex="0">
        <article class="panel"><h2>操作记录</h2><div id="v-actions"></div>
          <div class="pager"><button id="v-history-prev" class="secondary" type="button" data-virtual-history-page="prev">上一页</button><span id="v-history-page" aria-live="polite">—</span><button id="v-history-next" class="secondary" type="button" data-virtual-history-page="next">下一页</button></div>
        </article>
        </section>
        <section id="virtual-panel-positions" class="real-tab-panel" role="tabpanel" aria-labelledby="virtual-tab-positions" tabindex="0">
          <article class="panel"><h2>历史持仓</h2><div id="v-closed-positions"></div>
            <div class="pager"><button class="secondary" type="button" data-virtual-positions-page="prev">上一页</button><span id="v-positions-page" aria-live="polite">—</span><button class="secondary" type="button" data-virtual-positions-page="next">下一页</button></div>
          </article>
        </section>
      </section>
      <section id="view-real" class="view active">
        <div class="real-tabs" role="tablist" aria-label="实盘内容">
          <button id="real-tab-signals" class="real-tab active" type="button" role="tab" aria-selected="true" aria-controls="real-panel-signals" data-real-tab="signals">信号</button>
          <button id="real-tab-positions" class="real-tab" type="button" role="tab" aria-selected="false" aria-controls="real-panel-positions" data-real-tab="positions">当前持仓</button>
          <button id="real-tab-history" class="real-tab" type="button" role="tab" aria-selected="false" aria-controls="real-panel-history" data-real-tab="history">操作记录</button>
          <button id="real-tab-closed" class="real-tab" type="button" role="tab" aria-selected="false" aria-controls="real-panel-closed" data-real-tab="closed">历史持仓</button>
        </div>
        <section id="real-panel-signals" class="real-tab-panel active" role="tabpanel" aria-labelledby="real-tab-signals" tabindex="0">
          <div class="metrics real-metrics">
            <article class="metric"><span>今日计划股票</span><strong id="r-count">—</strong></article>
            <article class="metric"><span>系统托管持仓</span><strong id="r-open">—</strong></article>
            <article class="metric"><span>用户自行操作持仓</span><strong id="r-manual">—</strong></article>
          </div>
          <article class="panel"><h2>待处理提醒</h2><div id="r-alerts"></div></article>
          <article class="panel"><div class="panel-head"><h2>监听买入</h2><span id="r-date" class="tiny">—</span></div><div id="r-watch"></div></article>
          <article class="panel"><h2>监听卖出</h2><div id="r-sell-signals"></div></article>
        </section>
        <section id="real-panel-positions" class="real-tab-panel" role="tabpanel" aria-labelledby="real-tab-positions" tabindex="0">
          <article class="panel"><h2>当前持仓</h2><div id="r-positions"></div></article>
        </section>
        <section id="real-panel-history" class="real-tab-panel" role="tabpanel" aria-labelledby="real-tab-history" tabindex="0">
          <article class="panel"><h2>操作记录</h2><div id="r-report"></div>
            <div class="pager"><button id="r-history-prev" class="secondary" type="button" data-history-page="prev">上一页</button><span id="r-history-page" aria-live="polite">—</span><button id="r-history-next" class="secondary" type="button" data-history-page="next">下一页</button></div>
          </article>
        </section>
        <section id="real-panel-closed" class="real-tab-panel" role="tabpanel" aria-labelledby="real-tab-closed" tabindex="0">
          <article class="panel"><h2>历史持仓</h2><p class="tiny">收益率按提醒价和约半仓规则估算，未计费用；不代表实际盈亏。用户自行操作的持仓不计算收益率。</p><div id="r-closed-positions"></div>
            <div class="pager"><button class="secondary" type="button" data-real-positions-page="prev">上一页</button><span id="r-positions-page" aria-live="polite">—</span><button class="secondary" type="button" data-real-positions-page="next">下一页</button></div>
          </article>
        </section>
      </section>
      <section id="view-system" class="view">
        <div id="critical-banner" class="critical hidden"></div>
        <div class="grid-two"><article class="panel"><h2>服务状态</h2><div id="system-health"></div></article><article class="panel"><h2>行情覆盖</h2><div id="system-quality"></div></article></div>
      </section>
    </div>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/dashboard_v2.js?v=virtual-latest-pnl-1" defer></script>
</body>
</html>
